spring:
  application:
    name: taskmanager
  profiles:
    active: dev

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.taskmanager: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true


info:
  app:
    name: Task Manager
    description: Spring Boot Task Management Application
    version: 1.0.0